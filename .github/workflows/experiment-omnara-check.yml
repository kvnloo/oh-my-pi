name: Omnara experiment check

on:
  pull_request:
    branches:
      - exp/omnara-backend
      - exp/omnara-backend-preview
    paths:
      - "packages/coding-agent/src/experiments/omnara-*.ts"
      - "packages/coding-agent/src/main.ts"
      - "packages/coding-agent/src/session/agent-session.ts"
      - "packages/coding-agent/test/omnara-*.test.ts"
      - ".github/workflows/experiment-omnara-check.yml"
  push:
    branches:
      - exp/omnara-backend
      - exp/omnara-backend-preview
      - exp/omnara-*

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-install
      - name: Format experiment files
        run: |
          files=(
            packages/coding-agent/src/experiments/omnara-*.ts
            packages/coding-agent/test/omnara-*.test.ts
            packages/coding-agent/src/main.ts
          )
          ./node_modules/.bin/oxfmt "${files[@]}"
          git diff -- "${files[@]}"
          git diff --quiet -- "${files[@]}"
      - name: Type check coding agent
        run: bun --cwd=packages/coding-agent run check:types
      - name: Test Omnara bridge
        run: bun test packages/coding-agent/test/omnara-*.test.ts
